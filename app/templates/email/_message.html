<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f5fa;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1b1e2e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5fa;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:14px;border:1px solid #e3e5f0;">
            <tr>
              <td style="padding:28px 32px 8px;font-size:15px;font-weight:700;color:#5b5bf0;">{{ brand }}</td>
            </tr>
            <tr>
              <td style="padding:8px 32px 28px;font-size:15px;line-height:1.6;">
                {{ content | safe }}
              </td>
            </tr>
          </table>
          <p style="max-width:520px;font-size:12px;line-height:1.5;color:#7a7f99;margin:16px auto 0;">
            You are receiving this email because of activity on your {{ app_name }} account.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
