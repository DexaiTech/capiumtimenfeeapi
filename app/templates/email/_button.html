{% macro button(url, label) %}
<p style="margin:24px 0;">
  <a href="{{ url }}" style="display:inline-block;background:#5b5bf0;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px;">{{ label }}</a>
</p>
<p style="font-size:13px;color:#7a7f99;word-break:break-all;">If the button does not work, copy this link into your browser:<br>{{ url }}</p>
{% endmacro %}
