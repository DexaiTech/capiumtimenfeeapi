# Deploy the API and worker to Azure Container Apps. Manual only: Actions → "Deploy to Azure" →
# Run workflow. Never runs on push; a release needs explicit approval (CLAUDE.md).
#
# One-off setup per environment (infra/README.md): deploy infra/ once, create a GitHub
# environment named like the input (dev, prod) with the variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and AZURE_RESOURCE_GROUP, and give that client a
# federated credential for this repository's environment (OIDC: no stored secret).
name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: capium-${{ inputs.environment }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the registry
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          ACR=$(az acr list -g "$RG" --query "[0].name" -o tsv)
          test -n "$ACR" || { echo "No container registry in $RG: deploy infra/ first"; exit 1; }
          echo "ACR=$ACR" >> "$GITHUB_ENV"
          echo "REGISTRY=$(az acr show -n "$ACR" --query loginServer -o tsv)" >> "$GITHUB_ENV"

      - name: Build the images in the registry
        run: |
          az acr build -r "$ACR" -t "capium-api:$TAG" --target api .
          az acr build -r "$ACR" -t "capium-worker:$TAG" --target worker .

      - name: Migrate the database
        run: |
          az containerapp job update -n "$PREFIX-migrate" -g "$RG" --image "$REGISTRY/capium-api:$TAG"
          EXECUTION=$(az containerapp job start -n "$PREFIX-migrate" -g "$RG" --query name -o tsv)
          for _ in $(seq 1 120); do
            STATUS=$(az containerapp job execution show -n "$PREFIX-migrate" -g "$RG" \
              --job-execution-name "$EXECUTION" --query properties.status -o tsv)
            echo "migration: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 10
          done
          echo "migration did not finish in 20 minutes"; exit 1

      - name: Roll out the API and the worker
        run: |
          az containerapp update -n "$PREFIX-api" -g "$RG" --image "$REGISTRY/capium-api:$TAG"
          az containerapp update -n "$PREFIX-worker" -g "$RG" --image "$REGISTRY/capium-worker:$TAG"

      - name: Check the live site
        run: |
          UI=$(az containerapp show -n "$PREFIX-ui" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          for _ in $(seq 1 30); do
            if curl -fsS "https://$UI/api/v1/system" > /dev/null; then echo "https://$UI/api/v1/system answers 200"; exit 0; fi
            sleep 10
          done
          echo "https://$UI/api/v1/system is not answering 200: tell the lead"; exit 1
