name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: capium
          POSTGRES_PASSWORD: capium
          POSTGRES_DB: capium_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U capium -d capium_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI values: nothing here is a real secret.
      APP_ENV: development
      DB_URL: postgresql://capium:capium@localhost:5432/capium_test
      TEST_DB_URL: postgresql://capium:capium@localhost:5432/capium_test
      JWT_SECRET_KEY: ci-only-secret-0123456789-0123456789-0123456789
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      SMTP_HOST: localhost
      SMTP_FROM_ADDRESS: no-reply@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy app
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -q
