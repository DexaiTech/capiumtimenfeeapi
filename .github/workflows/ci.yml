name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: capium-root
          MYSQL_USER: capium
          MYSQL_PASSWORD: capium
          MYSQL_DATABASE: capium_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ucapium -pcapium"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway CI values: nothing here is a real secret.
      APP_ENV: development
      DB_URL: mysql://capium:capium@127.0.0.1:3306/capium_test
      TEST_DB_URL: mysql://capium:capium@127.0.0.1:3306/capium_test
      JWT_SECRET_KEY: ci-only-secret-0123456789-0123456789-0123456789
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      SMTP_HOST: localhost
      SMTP_FROM_ADDRESS: no-reply@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Configure MySQL like Azure (collation, isolation, triggers)
        run: |
          mysql -h 127.0.0.1 -uroot -pcapium-root -e "
            SET PERSIST transaction_isolation = 'READ-COMMITTED';
            SET PERSIST log_bin_trust_function_creators = ON;
            ALTER DATABASE capium_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs;"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy app
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -q

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholders so the parameter files compile; nothing is deployed.
      MYSQL_ADMIN_PASSWORD: ci-placeholder-password
      JWT_SECRET_KEY: ci-placeholder-0123456789-0123456789
      MFA_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXktMDA=
    steps:
      - uses: actions/checkout@v4
      - name: Bicep compiles and lints
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          for params in infra/env/*.bicepparam; do
            az bicep build-params --file "$params" --stdout > /dev/null
          done
