# Local development stack for Capium Time & Fees. Every secret here is for local use only.
# Not for deployment: deploy the API from the Dockerfile (see docs/deployment.md).
#
#   docker compose -f docker-compose.dev.yml up -d mysql azurite mailpit  # database, blob emulator, mail
#   docker compose -f docker-compose.dev.yml --profile app up --build     # plus migrations, API, worker
#
# MySQL 8.4: localhost:3307, database "capium" (and "capium_test" for the test suite).
# Azurite (Azure Blob Storage emulator): localhost:10000, used by the app profile for uploads.
# Mailpit inbox: http://localhost:8025. API: http://localhost:8000/docs.
services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --transaction-isolation=READ-COMMITTED
      - --log-bin-trust-function-creators=ON
    environment:
      MYSQL_ROOT_PASSWORD: capium-root
      MYSQL_USER: capium
      MYSQL_PASSWORD: capium
      MYSQL_DATABASE: capium
    ports: ["3307:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucapium", "-pcapium"]
      interval: 5s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest # development-only blob emulator
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]

  mailpit:
    image: axllent/mailpit:latest # development-only mail catcher
    ports: ["1025:1025", "8025:8025"] # SMTP, web inbox

  migrate:
    build:
      context: .
      target: api
    command: alembic upgrade head
    # .env is optional: the values below are enough for a local stack and override it.
    env_file:
      - path: .env
        required: false
    environment: &container_env
      APP_ENV: development
      DB_URL: mysql://capium:capium@mysql:3306/capium
      JWT_SECRET_KEY: local-development-only-secret-0123456789abcdef
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: no-reply@capium.local
      # Azurite's well-known development account (public, documented by Microsoft).
      AZURE_STORAGE_CONTAINER: uploads
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    depends_on:
      mysql: { condition: service_healthy }
      azurite: { condition: service_started }
    profiles: [app]

  api:
    build:
      context: .
      target: api
    env_file:
      - path: .env
        required: false
    environment: *container_env
    ports: ["8000:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"
      interval: 10s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    profiles: [app]

  worker:
    build:
      context: .
      target: worker
    env_file:
      - path: .env
        required: false
    environment: *container_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    profiles: [app]

volumes:
  mysqldata:
